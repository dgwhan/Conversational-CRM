services:
  postgres:
    image: postgres:16-alpine
    container_name: crm_postgres
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-recruitment_crm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-recruitment_crm}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - crm_network

  redis:
    image: redis:7-alpine
    container_name: crm_redis
    restart: unless-stopped
    # AOF để job BullMQ còn nguyên khi Redis khởi động lại
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - crm_network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: crm_api
    restart: unless-stopped
    # Nạp toàn bộ biến (JWT_ACCESS_SECRET, TOKEN_ENCRYPTION_KEY, PASSWORD_RECOVERY_*...) từ .env;
    # các giá trị trong "environment" bên dưới ghi đè cho mạng nội bộ của Docker.
    env_file:
      - .env
    environment:
      TZ: Asia/Ho_Chi_Minh
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-recruitment_crm}?schema=public}
      REDIS_URL: ${REDIS_URL_DOCKER:-redis://redis:6379}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crm_network

volumes:
  postgres_data:
    name: crm_postgres_data
  redis_data:
    name: crm_redis_data

networks:
  crm_network:
    name: crm_network
    driver: bridge
